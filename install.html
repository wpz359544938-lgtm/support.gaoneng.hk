<!DOCTYPE html>
<!--
  ============================================================
  安装视频页（YouTube 版）
  视频地址在 video-manifest.js 里维护，这里是播放逻辑
  ============================================================
-->
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Installation &amp; Demo Videos — Gonengo</title>
<meta name="theme-color" content="#FBF9F6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23151310'/%3E%3Ctext x='16' y='22.5' font-family='Arial,Helvetica,sans-serif' font-size='17' font-weight='700' fill='%23fff' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/bootstrap.min.css">
<link rel="stylesheet" href="theme.css">
<style>
  /* 型号选择 */
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .chip{
    padding:11px 4px;border:1px solid var(--bs-border-color);background:#fff;
    border-radius:13px;font:inherit;font-size:13.5px;font-weight:600;color:#15130F;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:transform .15s ease, background-color .18s ease, border-color .18s ease, color .18s ease;
  }
  .chip:active{transform:scale(.955)}
  .chip.is-on{background:#15130F;border-color:#15130F;color:#fff}
  .chip:focus-visible{outline:2px solid var(--brand-green);outline-offset:3px}

  /* 播放器：先给封面，点了才加载 YouTube */
  .player{
    position:relative;width:100%;aspect-ratio:9/16;max-height:60vh;
    background:#0F0E0C;border-radius:18px;overflow:hidden;
    box-shadow:0 24px 50px -30px rgba(21,19,15,.8);
  }
  .player iframe{width:100%;height:100%;border:0;display:block}
  .yt-facade{
    position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;
    border:0;padding:0;background:#0F0E0C;
  }
  .yt-facade img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .yt-facade i{
    position:relative;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;
    background:rgba(15,14,12,.55);color:#fff;backdrop-filter:blur(3px);
    box-shadow:0 10px 26px rgba(0,0,0,.35);
    transition:transform .15s ease;
  }
  .yt-facade:active i{transform:scale(.94)}
  .yt-facade:focus-visible{outline:2px solid var(--brand-green);outline-offset:-3px}
</style>
</head>
<body>

<main class="container py-4" style="max-width:520px">

  <!-- 顶栏 -->
  <div class="d-flex align-items-center justify-content-between mb-4">
    <a href="index.html" class="small text-decoration-none" style="color:var(--bs-secondary-color)">← Back</a>
    <div class="d-inline-flex align-items-center gap-2">
      <span class="brand-name">Gonengo</span>
    </div>
    <span style="width:42px" aria-hidden="true"></span>
  </div>

  <!-- 标题 -->
  <h1 class="fw-bold mb-1" style="font-size:1.4rem;letter-spacing:-.02em">Installation &amp; Demo Videos</h1>
  <p class="small mb-4" style="color:var(--bs-secondary-color)">Pick your model — each clip takes about two minutes.</p>

  <!-- 型号 -->
  <div class="chips mb-3" role="tablist" aria-label="Model"></div>

  <!-- 播放器 -->
  <div class="player mb-3" id="player-box"></div>

  <p class="small mb-3" id="caption" style="color:var(--bs-secondary-color)"></p>

  <p class="small mb-0" style="color:var(--bs-secondary-color)">
    Something not clear? <a class="link-secondary" href="mailto:qq369648803@gmail.com?subject=Installation%20help%20-%20Gonengo">Email us</a> — we'll walk you through it.
  </p>

</main>

<footer class="text-center small py-3" style="color:var(--bs-secondary-color)">
  © <span id="year">2026</span> Gonengo
</footer>

<script src="video-manifest.js"></script>
<script>
  (function () {
    /* 型号清单在 video-manifest.js 里，改那个文件即可 */
    var VIDEOS = window.VIDEOS || [];

    document.getElementById('year').textContent = new Date().getFullYear();

    var chips   = document.querySelector('.chips');
    var box     = document.getElementById('player-box');
    var caption = document.getElementById('caption');
    var current = -1;

    var PLAY_ICON = '<i><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M9 7.2v9.6L17 12z"/></svg></i>';

    function buzz() {
      if (navigator.vibrate) { try { navigator.vibrate(6); } catch (e) {} }
    }

    // 有本地封面用本地的，没有就退回 YouTube 自带缩略图
    function posterUrl(v) {
      if (v.poster) return v.poster;
      if (v.yt) return 'https://i.ytimg.com/vi/' + v.yt + '/maxresdefault.jpg';
      return '';
    }

    function renderFacade(v) {
      box.innerHTML = '';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'yt-facade';
      btn.setAttribute('aria-label', 'Play ' + v.label + ' installation video');
      var p = posterUrl(v);
      btn.innerHTML = (p ? '<img src="' + p + '" alt="">' : '') + PLAY_ICON;
      var im = btn.querySelector('img');
      if (im && v.yt) {
        // 高清缩略图不一定存在，失败就退回标准图
        im.onerror = function () { im.onerror = null; im.src = 'https://i.ytimg.com/vi/' + v.yt + '/hqdefault.jpg'; };
      }

      btn.addEventListener('click', function () {
        if (!v.yt) {
          caption.textContent = v.label + ' — video link not set yet';
          return;
        }
        box.innerHTML =
          '<iframe src="https://www.youtube-nocookie.com/embed/' + v.yt +
          '?autoplay=1&playsinline=1&rel=0" title="' + v.label +
          ' installation video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
        buzz();
      });

      box.appendChild(btn);
    }

    function select(i, autoplay) {
      if (i === current) {
        if (autoplay) box.querySelector('.yt-facade') && box.querySelector('.yt-facade').click();
        return;
      }
      current = i;
      var v = VIDEOS[i];
      if (!v) return;

      Array.prototype.forEach.call(chips.children, function (b, k) {
        b.classList.toggle('is-on', k === i);
        b.setAttribute('aria-selected', k === i ? 'true' : 'false');
      });

      box.style.aspectRatio = v.ratio || '9 / 16';
      caption.textContent = v.label + ' model';
      renderFacade(v);

      if (autoplay) buzz();
    }

    VIDEOS.forEach(function (v, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', 'false');
      b.textContent = v.label;
      b.addEventListener('click', function () { select(i, true); });
      chips.appendChild(b);
    });

    if (VIDEOS.length) select(0, false);
  })();
</script>

</body>
</html>
